  <circle cx="60.4" cy="39.8" r="3.4" fill="#1f1a17"/>
  <circle cx="41.2" cy="38.7" r="1.1" fill="#ffffff"/>
  <circle cx="61.2" cy="38.7" r="1.1" fill="#ffffff"/>
