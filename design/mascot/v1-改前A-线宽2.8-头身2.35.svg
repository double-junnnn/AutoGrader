  <path d="M32.5 28q8.5-4.5 15.5-1" fill="none" stroke="#1f1a17" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M53.5 30q9.5-1 15.5 3" fill="none" stroke="#1f1a17" stroke-width="3.2" stroke-linecap="round"/>
  <!-- 鼻 -->
  <path d="M48.4 45.5q1.6 2.8 3.2 0" fill="none" stroke="#1f1a17" stroke-width="2.3" stroke-linecap="round"/>
