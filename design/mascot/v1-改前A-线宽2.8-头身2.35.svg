  <circle cx="26" cy="37" r="5.6" fill="#f6d2a9" stroke="#1f1a17" stroke-width="2.4"/>
  <circle cx="74" cy="37" r="5.6" fill="#f6d2a9" stroke="#1f1a17" stroke-width="2.4"/>
