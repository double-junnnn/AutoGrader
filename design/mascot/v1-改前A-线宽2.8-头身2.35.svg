  <path d="M93.5 47L97.5 41" stroke="#1f1a17" stroke-width="5" stroke-linecap="round"/>
  <circle cx="83" cy="63" r="5.6" fill="#f6d2a9" stroke="#1f1a17" stroke-width="2.4"/>
