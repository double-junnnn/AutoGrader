  <path d="M50 65l10.5-5.5v11z" fill="#e23d28" stroke="#1f1a17" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="50" cy="65" r="3.4" fill="#e23d28" stroke="#1f1a17" stroke-width="2.2"/>
