  <path d="M31.6 38.8A8.4 7.8 0 0 1 48.4 35.8Z" fill="#f6d2a9" stroke="#1f1a17" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M51.6 35.8A8.4 7.8 0 0 1 68.4 38.8Z" fill="#f6d2a9" stroke="#1f1a17" stroke-width="2.2" stroke-linejoin="round"/>
